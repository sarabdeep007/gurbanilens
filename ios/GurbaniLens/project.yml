name: GurbaniLens
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

# iOS 16 is the deployment target because v1 uses SwiftUI NavigationStack
# (iOS 16+) and WhisperKit requires iOS 16+. At time of writing iOS 16 is on
# ~95%+ of iPhones; bumping below would require both a state-driven
# NavigationView rewrite and a different ASR engine — not worth it for v1.

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Brief #9.16.1-iOS (2026-07-01): pin to `minimal` to unblock
    # existing NSLock-in-async-context patterns in StreamingProvider.
    # Newer Xcode versions default to `targeted`/`complete`, converting
    # those warnings to errors. Proper migration to actor /
    # OSAllocatedUnfairLock is a substantial refactor deferred to a
    # follow-up brief; this pin restores the pre-existing behavior
    # without touching the underlying code.
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    # Bundle id chosen to be unique under a domain Deep controls (gurbanilens.org)
    # so personal-Apple-ID team signing doesn't clash with another sideloaded
    # build on a different Mac. Override DEVELOPMENT_TEAM at sign time.
    PRODUCT_BUNDLE_IDENTIFIER: org.gurbanilens.app
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  # Sibling SPM package in this repo — Swift port of the matcher (11/11
  # port-parity PASS against canonical Python).
  GurbaniLensCore:
    path: ../GurbaniLensCore
  # WhisperKit — Apple-Silicon-optimised CoreML on-device Whisper. Provides
  # `import WhisperKit`. Auto-downloads the recommended CoreML model from
  # huggingface.co/argmaxinc/whisperkit-coreml on first launch unless we
  # supply a pre-bundled modelFolder. Pin to ≥1.0.0 (released 2026-05-01).
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "1.0.0"
  # Starscream — NWConnection-backed WebSocket client. Replaces
  # URLSessionWebSocketTask for SarvamProvider streaming after the
  # latter failed with "Socket is not connected" ~500 ms after the
  # first audio frame, on 4/4 attempts. Same wire protocol (see
  # scripts/sarvam-investigation/WORKING_PROTOCOL.md), different
  # transport — production-proven in Lyft / Square / Trello.
  Starscream:
    url: https://github.com/daltoniam/Starscream.git
    from: "4.0.0"
  # onnxruntime-objc — Microsoft's official Swift wrapper around the
  # ONNX Runtime C API. Powers the on-device Silero VAD that gates
  # `CloudMicCapture` (Brief #7, 2026-06-25). The package is a thin
  # ObjC shim over a precompiled framework; if it conflicts with
  # WhisperKit or Starscream at SPM-resolve time, the resolver will
  # surface a clear error in Xcode and we iterate from there.
  onnxruntime-objc:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: "1.18.0"

targets:
  GurbaniLens:
    type: application
    platform: iOS
    sources:
      - path: GurbaniLens
        excludes:
          - "**/.DS_Store"
      # Brief #9.8-iOS (2026-06-29): explicit reference to the
      # Generated/ directory so the Swift-codegen EnvConfig.swift
      # (created by `scripts/inject_env_to_swift.sh` on every build)
      # is reachable from the project even on a fresh checkout where
      # the directory doesn't exist yet. `optional: true` tells
      # xcodegen not to fail when the dir is missing at generate
      # time; `type: group` makes it a yellow group so files inside
      # are added to Compile Sources.
      - path: GurbaniLens/Generated
        excludes:
          - "**/.DS_Store"
        type: group
        optional: true
    resources:
      - path: GurbaniLens/Resources/Assets.xcassets
        optional: true
      # Optional pre-bundled WhisperKit CoreML model tree (openai_whisper-small).
      # If absent, WhisperKit auto-downloads on first launch. Populated by
      # `scripts/fetch_ios_deps.sh --bundle-model`. Gitignored.
      - path: GurbaniLens/Resources/Models
        optional: true
      # Bundled SGGS corpus (app_database.sqlite). Populated by
      # `scripts/fetch_ios_deps.sh` from data/sggs/database.sqlite. Gitignored.
      - path: GurbaniLens/Resources/Data
        optional: true
      # Bundled Noto Serif Gurmukhi (variable font, OFL-licensed).
      # Populated by `scripts/fetch_ios_deps.sh` from
      # github.com/google/fonts/tree/main/ofl/notoserifgurmukhi.
      # Gitignored — fetched, not committed.
      - path: GurbaniLens/Resources/Fonts
        optional: true
      # Silero VAD v5 ONNX model (~2.3 MB, MIT-licensed). Drives the
      # voice-activity gate in CloudMicCapture so we don't transcribe
      # silence or background noise. Fetched by fetch_ios_deps.sh.
      # Gitignored.
      - path: GurbaniLens/Resources/VAD
        optional: true
    info:
      path: GurbaniLens/Resources/Info.plist
      properties:
        CFBundleDisplayName: GurbaniLens
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Noto Serif Gurmukhi (variable font) is bundled and
        # registered via UIAppFonts so SwiftUI `Font.custom(...)` can
        # resolve it. Variable font: a single file carries the full
        # weight axis; SwiftUI's `.weight()` modifier picks the
        # closest registered instance.
        #
        # Brief #7.1 (2026-06-26): the previous entry was
        # "Fonts/NotoSerifGurmukhi-Variable.ttf" but the font failed
        # to register — Deep's iPhone log: "FontParser could not open
        # filePath /.../GurbaniLens.app/Fonts/NotoSerifGurmukhi-
        # Variable.ttf [2: No such file or directory]". XcodeGen with
        # `path: GurbaniLens/Resources/Fonts` creates a GROUP
        # reference; files inside the group are added to the build
        # phase individually and end up FLAT at the bundle root,
        # not preserved under a Fonts/ subdir. Dropping the prefix
        # is the simplest fix — no project restructure needed and
        # iOS finds the font.
        UIAppFonts:
          - NotoSerifGurmukhi-Variable.ttf
        # Microphone permission. Plain language; we tell the user exactly
        # what we do with audio. v1 is tap-to-record only — no background
        # listening, no recording without an explicit tap.
        NSMicrophoneUsageDescription: "GurbaniLens listens when you tap the microphone, transcribes what you recite, and looks up the matching Shabad. Audio stays on this device — nothing is uploaded."
    entitlements:
      # Intentionally empty entitlements file. Free-Apple-ID personal-team
      # signing rejects `com.apple.developer.kernel.increased-memory-limit`
      # (provisioning fails); WhisperKit small models fit comfortably under
      # the default iOS memory cap, so we don't need it.
      path: GurbaniLens/Resources/GurbaniLens.entitlements
    dependencies:
      - package: GurbaniLensCore
        product: GurbaniLensCore
      - package: WhisperKit
        product: WhisperKit
      - package: Starscream
        product: Starscream
      - package: onnxruntime-objc
        product: onnxruntime
    # Brief #9.8-iOS (2026-06-29): replaced the brittle .env → Info.plist
    # PlistBuddy injection with a .env → Swift codegen step that writes
    # ios/GurbaniLens/GurbaniLens/Generated/EnvConfig.swift before each
    # build. Providers read EnvConfig.x directly (compiled into the
    # binary at compile time) instead of doing
    # Bundle.main.object(forInfoDictionaryKey:) at runtime. The plist
    # approach was intermittently failing across Xcode versions +
    # sandbox modes; the codegen approach has none of those failure
    # modes — if the file compiles, the values are there.
    preBuildScripts:
      - name: Generate EnvConfig.swift from .env
        runOnlyWhenInstalling: false
        showEnvVars: false
        script: |
          "$SRCROOT/../../scripts/inject_env_to_swift.sh"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        ENABLE_PREVIEWS: YES
